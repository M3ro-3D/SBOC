name: SBOC source checks
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'cryptography>=41,<47'
      - run: bash -n install.sh
      - run: python -m compileall -q sboc tests
      - run: python -m unittest discover -s tests -v
